<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts Lab · MarketLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.ccard { background: #FFFFFF; color: var(--ink); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
.ccard:hover { transform: translateY(-5px); box-shadow: 0 30px 60px -30px rgba(139,133,255,.55); }
.ccard h3 { font-size: 18px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
.plot { background: #FBFBFE; border: 1px solid #F0F1F6; border-radius: 16px; padding: 6px; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #312E81; background: #F3F3FF; border-radius: 12px; padding: 10px 12px; }
.num { background: #0E1324; color: #FFF; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 7px; }
.tabs { position: sticky; top: 61px; z-index: 5; background: rgba(11,15,30,.9); backdrop-filter: blur(12px); padding-top: 18px; padding-bottom: 16px; }
.glow { position: absolute; right: -60px; top: 0; width: 640px; max-width: 70%; pointer-events: none; animation: glow 5s ease-in-out infinite; }
@media (max-width: 900px) { .tabs { position: static; } }
</style>
</head>
<body class="dark">
<main>
  <section class="wrap night" style="padding-top:56px;padding-bottom:20px;position:relative;overflow-x:clip">
    <svg class="glow" viewBox="0 0 600 300" aria-hidden="true"><defs><radialGradient id="hg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4F46E5" stop-opacity=".55"></stop><stop offset="1" stop-color="#4F46E5" stop-opacity="0"></stop></radialGradient></defs><ellipse cx="300" cy="150" rx="300" ry="150" fill="url(#hg)"></ellipse></svg>
    <div style="position:relative">
      <div class="eyebrow">DATA VISUALIZATION · UNITS 1 – 5 + CASE STUDY</div>
      <h1 class="anim-up" style="font-size:clamp(40px,5.5vw,72px);letter-spacing:-.04em;line-height:1;margin-top:14px;font-weight:760">The Charts Lab.<br><span style="color:#8A91B5">26 charts, one syllabus.</span></h1>
      <p style="color:#C3C8D8;font-size:17px;line-height:1.6;max-width:640px;margin:18px 0 0">Every chart from Unit 1 to Unit 5 plus the supply-chain case study, drawn live from the project database. No Python windows: pick a unit, hover a card, open any chart large.</p>
    </div>
  </section>

  <section class="wrap" id="spot" style="padding-top:20px;scroll-margin-top:70px">
    <div style="background:#FFF;color:#0E1324;border-radius:28px;padding:28px;display:flex;flex-wrap:wrap;gap:28px">
      <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:10px"><span class="num mono" id="sp-num" style="font-size:13px;padding:6px 10px">—</span><span class="eyebrow" id="sp-unit" style="color:#4F46E5"></span></div>
        <h2 id="sp-title" style="font-size:30px;line-height:1.12;font-weight:720;letter-spacing:-.02em">Loading charts…</h2>
        <p id="sp-desc" style="color:#4A5266;font-size:15px;line-height:1.6;margin:0"></p>
        <div id="sp-ins" style="background:#EEF0FF;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5;color:#312E81"></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;align-items:center">
          <button type="button" class="btn ghost small" id="prev" aria-label="Previous chart">← Prev</button>
          <button type="button" class="btn ghost small" id="next" aria-label="Next chart">Next →</button>
          <button type="button" class="btn ghost small" id="replay" aria-label="Replay the animation">↻ Replay</button>
          <span class="mono small" id="sp-pos" style="margin-left:4px"></span>
        </div>
      </div>
      <div class="plot" id="sp-plot" style="flex:2 1 560px;min-width:0;padding:12px;border-radius:20px"><div class="skel" style="height:340px"></div></div>
    </div>
  </section>

  <section class="wrap night tabs" style="margin-top:20px">
    <div role="tablist" aria-label="Syllabus unit" id="tabs" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  </section>

  <section class="wrap" style="padding-top:8px;padding-bottom:30px">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:18px">
      <h2 id="tab-title" style="font-size:26px;font-weight:700">All 26 charts</h2><span id="tab-note" style="color:#8A91B5;font-size:14px"></span>
    </div>
    <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:18px"></div>
  </section>
</main>
<script src="assets/app.js"></script>
<script src="js/charts.js"></script>
</body>
</html>
